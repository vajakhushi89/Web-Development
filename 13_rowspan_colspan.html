<html>
    <head>
        <title>Table rowspan and colspan</title>
    </head>
    <body>
        <h1>Student result</h1>
        <table border="1" cellpadding="10" cellspacing="5">
            <tr>
                <th colspan="3">Student details</th>
            </tr>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td rowspan="2">abc</td>
                <td>html</td>
                <td>85</td>
            </tr>
            <tr>
                <td>css</td>
                <td>90</td>
            </tr>
        </table>
    </body>
</html>
