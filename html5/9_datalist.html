<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalist</title>
</head>
<body>
    <h2>Select your country</h2>
    <input list="countries" placeholder="Enter country">
    <datalist id="countries">
        <option value="India">
        <option value="Kazakistan">
        <option value="USA">
        <option value="France">
        <option value="Canada">
        <option value="UK">
        <option value="Bhutan">
        <option value="Nepal">
        <option value="Russia">
        <option value="Chin">
        <option value="Japan">
        <option value="Australia">
    </datalist>
</body>
</html>
