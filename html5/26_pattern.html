<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="success.html" method="post">
        <label for="pan">Pancard number : <br>xxxxx9999x</label>
        <br>
        <input type="text" id="pan" name="pan" required pattern="[a-zA-Z]{5}[0-9]{4}[a-zA-z{1}]">
        <br><br>
        <label for="aadhar">
            Aadhar card number : 
        </label>
        <br>
        <input type="text" id="aadhar" name="aadhar" required pattern="[1-9]{12}">
        <br><br>
        <label for="credit">Credit card number : </label>
        <br>
        <input type="text" id="credit" name="credit" required pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}">
        <br><br>
        <label for="cvv">cvv number : </label>
        <input type="text" id="cvv" name="cvv" required pattern="[0-9]{3}">
        <br><br>
        <label for="expiry">Expiry date  : </label>
        <input type="text" id="expiry" name="expiry">
        <br><br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
